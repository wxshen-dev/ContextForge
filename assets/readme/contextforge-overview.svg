<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">ContextForge: documents into traceable answers</title>
  <desc id="description">An Atlas M42 document becomes searchable passages, which produce an answer with visible processing steps.</desc>
  <rect width="1200" height="360" rx="22" fill="#173f48"/>
  <path d="M610 55v250" stroke="#41646b" stroke-width="1"/>

  <g id="project-title" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">
    <text x="60" y="114" fill="#d0e5e5" font-size="20" font-weight="600">DOCUMENT KNOWLEDGE WORKSPACE</text>
    <text x="58" y="184" fill="#ffffff" font-size="68" font-weight="700" letter-spacing="-3">ContextForge</text>
    <text x="60" y="236" fill="#e0eeee" font-size="26">Ask your documents.</text>
    <text x="60" y="270" fill="#e0eeee" font-size="26">Follow the answer.</text>
    <path d="M60 310h476" stroke="#41646b" stroke-width="1"/>
    <text x="60" y="337" fill="#a8cbca" font-size="17">PDF + MARKDOWN  /  SEARCH  /  STREAMED CHAT</text>
  </g>

  <g id="document-to-answer" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">
    <rect x="648" y="92" width="145" height="170" rx="10" fill="#eff7f5"/>
    <path d="M673 92v39h39" fill="#d3e9e4"/>
    <text x="668" y="161" fill="#17434b" font-size="20" font-weight="700">Atlas M42</text>
    <path d="M668 187h96M668 205h78M668 223h87" stroke="#a6c3c1" stroke-width="7" stroke-linecap="round"/>
    <text x="665" y="288" fill="#b9d6d4" font-size="18">Source document</text>

    <path d="M805 177h35" stroke="#74c9be" stroke-width="3" stroke-linecap="round"/>
    <path d="m832 169 9 8-9 8" fill="none" stroke="#74c9be" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="853" y="105" width="95" height="36" rx="7" fill="#315d63" stroke="#6cadab"/>
    <rect x="853" y="157" width="95" height="36" rx="7" fill="#315d63" stroke="#6cadab"/>
    <rect x="853" y="209" width="95" height="36" rx="7" fill="#315d63" stroke="#6cadab"/>
    <text x="866" y="129" fill="#edf8f6" font-size="18">Passage</text>
    <text x="866" y="181" fill="#edf8f6" font-size="18">Passage</text>
    <text x="866" y="233" fill="#edf8f6" font-size="18">Passage</text>
    <text x="849" y="288" fill="#b9d6d4" font-size="18">Search index</text>

    <path d="M961 177h35" stroke="#74c9be" stroke-width="3" stroke-linecap="round"/>
    <path d="m988 169 9 8-9 8" fill="none" stroke="#74c9be" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="1010" y="92" width="142" height="170" rx="10" fill="#eff7f5"/>
    <text x="1030" y="130" fill="#17434b" font-size="20" font-weight="700">Answer</text>
    <path d="M1030 153h102M1030 173h85M1030 193h98" stroke="#a6c3c1" stroke-width="7" stroke-linecap="round"/>
    <circle cx="1038" cy="229" r="9" fill="#6bbba9"/>
    <path d="m1034 229 3 3 6-7" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1053" y="235" fill="#35756f" font-size="17" font-weight="600">7 steps</text>
    <text x="1024" y="288" fill="#b9d6d4" font-size="18">Grounded reply</text>
  </g>
</svg>
